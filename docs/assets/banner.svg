<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Levels</title>
  <desc id="d">Levels: 17 skills for Claude Code. Rate, propose, delegate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="15.5" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="80" y="82" font-size="16" letter-spacing="4" fill="#D97757">CLAUDE CODE SKILLS</text>

    <text x="80" y="176" font-size="104" font-weight="700" fill="#f0f6fc">levels</text>

    <text x="80" y="226" font-size="28" fill="#8b949e">rate. propose. delegate.</text>
    <text x="80" y="266" font-size="20" fill="#6e7681">17 skills · scale 1 to 5 · confirmation gate</text>
  </g>

  <!-- staircase: levels 1 to 5 -->
  <g>
    <rect x="780" y="200" width="64" height="50" rx="4" fill="#D97757" opacity="0.22"/>
    <rect x="864" y="160" width="64" height="90" rx="4" fill="#D97757" opacity="0.40"/>
    <rect x="948" y="120" width="64" height="130" rx="4" fill="#D97757" opacity="0.60"/>
    <rect x="1032" y="80" width="64" height="170" rx="4" fill="#D97757" opacity="0.80"/>
    <rect x="1116" y="40" width="64" height="210" rx="4" fill="#D97757"/>
    <line x1="764" y1="250.5" x2="1196" y2="250.5" stroke="#30363d"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" fill="#8b949e" text-anchor="middle">
    <text x="812" y="282">1</text>
    <text x="896" y="282">2</text>
    <text x="980" y="282">3</text>
    <text x="1064" y="282">4</text>
    <text x="1148" y="282">5</text>
  </g>
</svg>
